# Daily Steam Pulse snapshot. Inactive until the repo is pushed to GitHub.
# NOTE: GitHub runners are ephemeral; this workflow keeps the DuckDB + raw files in a cache/artifact.
# For a long-lived history, point STEAM_PULSE_DB at MotherDuck (md:) or commit parquet to a data branch.
name: steam-pulse-snapshot
on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours, off the hour
  workflow_dispatch: {}
concurrency: {group: steam-pulse, cancel-in-progress: false}
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - name: Restore data
        uses: actions/cache/restore@v4
        with:
          path: data
          key: steam-pulse-data-${{ github.run_id }}
          restore-keys: steam-pulse-data-
      - run: python -m venv .venv && .venv/bin/pip install -r requirements.txt
      - run: .venv/bin/pytest -q
      - run: .venv/bin/python -m steam_pulse.ingest
      - run: cd dbt && ../.venv/bin/dbt build --profiles-dir .   # includes snapshots + tests
      - name: Save data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: steam-pulse-data-${{ github.run_id }}
