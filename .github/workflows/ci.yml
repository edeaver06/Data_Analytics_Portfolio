# Tests for every project on push / PR.
# Raw data is gitignored; tests that need it skip themselves, and Olist / Steam Pulse fall back to
# small SYNTHETIC fixtures. Notebook tooling lives in requirements-dev.txt and is not installed here.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    name: test (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project:
          - aircraft-readiness
          - electricity-price-tracker
          - google-fiber-fcr
          - markets-vs-polls
          - nfl-closing-line
          - olist-ecommerce
          - rural-hospital-warning-signs
          - steam-pulse
    defaults:
      run:
        working-directory: projects/${{ matrix.project }}/code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            projects/${{ matrix.project }}/code/requirements.txt
            projects/${{ matrix.project }}/code/app/requirements.txt
      - name: Install (runtime + app pins; no notebook tooling)
        run: |
          python -m pip install --upgrade pip
          args=""
          for f in requirements.txt app/requirements.txt; do
            if [ -f "$f" ]; then args="$args -r $f"; fi
          done
          pip install $args
          python -m pytest --version
      - name: Test (includes Streamlit AppTest smoke tests)
        run: python -m pytest -q -rs

  r:
    name: test (diabetes-care-gaps, R)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: projects/diabetes-care-gaps/code
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.0"
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::readr
            any::tidyr
            any::lubridate
            any::DBI
            any::RSQLite
            any::testthat
      - name: Test (testthat; database checks skip without the built database)
        run: Rscript -e 'testthat::test_dir("tests", stop_on_failure = TRUE)'
