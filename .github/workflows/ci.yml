# Tests for every project on push / PR.
# Raw data is gitignored; tests that need it skip themselves, and Olist / Steam Pulse fall back to
# small SYNTHETIC fixtures. Notebook tooling lives in requirements-dev.txt and is not installed here.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    name: test (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project:
          - aircraft-readiness
          - google-fiber-fcr
          - markets-vs-polls
          - nfl-closing-line
          - olist-ecommerce
          - steam-pulse
    defaults:
      run:
        working-directory: projects/${{ matrix.project }}/code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            projects/${{ matrix.project }}/code/requirements.txt
            projects/${{ matrix.project }}/code/app/requirements.txt
      - name: Install (runtime + app pins; no notebook tooling)
        run: |
          python -m pip install --upgrade pip
          args=""
          for f in requirements.txt app/requirements.txt; do
            if [ -f "$f" ]; then args="$args -r $f"; fi
          done
          pip install $args
          python -m pytest --version
      - name: Test (includes Streamlit AppTest smoke tests)
        run: python -m pytest -q -rs
